<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agentic PBT Fuzzing Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 16:9 schematic that scales to fit the screen; snake-shaped loop, step mode spotlights one stage. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15202b; --muted:#566273; --line:#cfd6df; --edge:#7a8594;
  --k-setup:#5d6b7e; --k-gen:#4b47d6; --k-gate:#a8590a; --k-exec:#1d68a8; --k-pbt:#167a3c; --k-analysis:#8a3aa6; --k-decide:#0b7268;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#151c24; --ink:#e6edf3; --muted:#9aa6b4; --line:#2b3642; --edge:#7a8796;
  --k-setup:#98a6b8; --k-gen:#9d9bff; --k-gate:#f0a54d; --k-exec:#5eaae8; --k-pbt:#4fd27f; --k-analysis:#cf8de8; --k-decide:#33cdb8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#151c24; --ink:#e6edf3; --muted:#9aa6b4; --line:#2b3642; --edge:#7a8796;
  --k-setup:#98a6b8; --k-gen:#9d9bff; --k-gate:#f0a54d; --k-exec:#5eaae8; --k-pbt:#4fd27f; --k-analysis:#cf8de8; --k-decide:#33cdb8; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:8px}
h1{margin:0;font-size:clamp(18px,2.1vw,28px);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:clamp(12px,1.05vw,15px)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
.btn:hover{border-color:var(--edge)}
.btn:focus-visible{outline:2px solid var(--k-gen);outline-offset:2px}
.zgrp{display:inline-flex;gap:4px;align-items:center;margin-left:6px}
.fitbox.pan{cursor:grab}.fitbox.pan.drag{cursor:grabbing;user-select:none}
.stepno{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:60px;text-align:center}
.fitbox{flex:1;min-height:0;position:relative;overflow:auto}
.sizer{position:relative;margin:0 auto}
.stage{position:absolute;left:0;top:0;width:1600px;height:1180px;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--k) 60%,var(--line));background:color-mix(in srgb,var(--k) 8%,var(--surface));padding:11px 14px;transition:opacity .25s,box-shadow .25s}
.node .nh{display:flex;align-items:baseline;gap:8px}
.node .num{font:600 14px/1 var(--mono);color:var(--k)}
.node .nt{font-weight:600;font-size:18px;line-height:1.2}
.node .nf{font:500 12.5px/1.3 var(--mono);color:var(--k);margin:3px 0 6px}
.node ul{margin:0;padding-left:17px;font-size:14.5px;line-height:1.4}
.node li::marker{color:var(--k)}
.node.small{padding:9px 11px}
.node.small .nt{font-size:15px}
.node.small ul{font-size:13px;padding-left:15px}
.node.small .nf{font-size:11.5px;margin-bottom:4px}
.k-setup{--k:var(--k-setup)}.k-gen{--k:var(--k-gen)}.k-gate{--k:var(--k-gate)}.k-exec{--k:var(--k-exec)}.k-pbt{--k:var(--k-pbt)}.k-analysis{--k:var(--k-analysis)}.k-decide{--k:var(--k-decide)}
.group{position:absolute;border-radius:14px;border:1.75px dashed color-mix(in srgb,var(--k) 65%,var(--line));background:color-mix(in srgb,var(--k) 5%,transparent);transition:opacity .25s}
.group .gh{position:absolute;left:18px;top:12px;display:flex;align-items:baseline;gap:8px}
.group .gh .nt{font-weight:600;font-size:18px}
.group .gh .nf{font:500 12.5px var(--mono);color:var(--k)}
.elabel{position:absolute;transform:translate(-50%,-50%);font-size:12.5px;font-weight:500;background:var(--surface);color:var(--muted);padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;transition:opacity .25s}
.on{box-shadow:0 0 0 3px var(--k)}
.dim{opacity:.16}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tg{font:500 11.5px/1.25 var(--mono);border:1px solid color-mix(in srgb,var(--k) 45%,var(--line));background:var(--surface);border-radius:5px;padding:2px 6px}
.node ul.dec{list-style:none;padding:0;margin-top:7px;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--k) 40%,var(--line));font-size:13.5px;line-height:1.35}
.node ul.dec li{position:relative;padding-left:16px;margin:2px 0}
.node ul.dec li::before{content:"";position:absolute;left:2px;top:.42em;width:7px;height:7px;background:var(--k-gate);transform:rotate(45deg)}
.node.small ul.dec{font-size:12.5px;margin-top:5px;padding-top:4px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-right:6px}
.legend i{width:8px;height:8px;background:var(--k-gate);transform:rotate(45deg);display:inline-block}
.hl{background:color-mix(in srgb,var(--k-pbt) 16%,transparent);border-radius:3px;padding:0 3px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div>
      <h1>Agentic PBT Fuzzing Pipeline for tomlc17</h1>
    </div>
    <div class="ctrl" role="toolbar" aria-label="Presentation controls">
      <span class="legend"><i></i>decision: if → then</span>
      <button class="btn" id="prev" type="button" aria-label="Previous stage">◀</button>
      <span class="stepno" id="stepno">overview</span>
      <button class="btn" id="next" type="button" aria-label="Next stage">▶</button>
      <button class="btn" id="all" type="button">Show all</button>
      <span class="zgrp" role="group" aria-label="Zoom">
        <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
        <span class="stepno" id="zval">100%</span>
        <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
        <button class="btn" id="zfit" type="button">Fit</button>
      </span>
      <button class="btn" id="fs" type="button">Full screen</button>
    </div>
  </header>
  <div class="fitbox" id="fitbox"><div class="sizer" id="sizer"><div class="stage" id="stage"></div></div></div>
</div>

<script>
(function(){
"use strict";
const W=1600,H=1180;
const stage=document.getElementById("stage");

// ----- nodes: [id, kind, x, y, w, h, num, title, file, bullets, small?, decisions]
const N=[
 ["inputs","setup",40,110,220,260,"","Inputs","Seed Prompt Numeric.txt",["Numeric-focused seed prompt","Gemini 3.1 Flash-Lite","Budget: 5 versions, $5","Target: tomlc17 @75565ea"],false,
   ["next call over budget → stop"]],
 ["prompt","gen",300,110,250,260,"1","Build the prompt","strategy_generator.py",["V1: seed + generation task","V2+: seed + best generator + feedback blocks","13 refinement rules: edit locally, keep plumbing"],false,
   ["edit the best-scoring version, not just the latest","empty feedback block → left out"]],
 ["llm","gen",590,110,220,260,"2","LLM writes a generator","llm_client.py",["Hypothesis strategy toml_documents","Valid: 1–8 key = number lines","Malformed: bad underscores, leading zeros, overflow","Thinking level: high"],false,[]],
 ["checks","gen",850,110,250,260,"3","Code checks","strategy_generator.py",["AST: no random, no @st.recursive, safe bounds","No out-of-range values in the valid leaf","Imports in a subprocess, draws 3 examples"],false,
   ["any check fails → regenerate (V1: next try · V2+: once)"]],
 ["gate","gate",1140,110,420,260,"4","Candidate gate","validate_generator.py · capability_check.py",["V1: 50 mixed + 50 valid-only inputs (MALFORMED_WEIGHT = 0)","V2–V5: capabilities compared with the previous version"],false,
   ["V1 rate ≥ 0.60 → pass; else retry with diagnosis (max 3, then keep best)","V2+ plumbing lost, recursion dropped or malformed < 50% → retry once, then skip","minor loss → run anyway, report it"]],
 ["campaign","exec",1140,430,420,220,"5","500-input campaign","campaign.py",["Hypothesis @given, 500 inputs, no deadline","One temp .toml file per input","Every result kept as {input, report}"],false,
   ["600 s wall clock reached → stop early"]],
 ["harness","exec",720,430,380,220,"6","Run tomlc17","runner.py · toml_harness.c",["Harness built with ASan + UBSan","5 s timeout per input","Sanitizers abort on the first error"],false,
   ["exit 0 → valid · 1 → rejected · 2 → harness error","sanitizer report, timeout or other exit → crash"]],
 ["triage","exec",300,430,380,220,"7","Triage","triage.py",["Reject text → 32 categories (INT_PARSE, ENDL_EXPECTED …)","Bug type + source line from the sanitizer","Crash signature: top 5 frames, recursion folded"],false,
   ["error text matches no rule → OTHER","crash → signature + compare with known crashes"]],
 ["crash","exec",40,430,220,220,"","Crash dedup","stack.py · crash_db.py",["LCS stack similarity","Shrink with hypothesis.find (≤ 200 tries)"],false,
   ["new signature → NEW_CRASH, shrink it"]],
 ["evidence","analysis",40,730,320,380,"9","Campaign evidence","feedback.py · structural_metrics.py · malformed_tracker.py",["Valid-path rate (50 inputs, malformed off)","New and rare accepted structures (k-paths)","Rejection trends and new categories","Nesting depth reached","Capabilities vs previous version"],false,
   ["send 2 signals: new crash > new structure > new error > …","validity < 0.20 → ask for more valid TOML","valid path < 0.80 → malformed guidance secondary","valid path < 0.95 → send defect list + examples"]],
 ["decide","decide",390,730,250,380,"10","Decide","loop.py",["Sets up the next version","Saves logs/iteration_N.json"],false,
   ["higher (crashes, healthy, depth, k-paths) → new best version","MALFORMED_WEIGHT by valid path: ≥ .95 → .20 · ≥ .85 → .15 · ≥ .70 → .10 · else .05","MAX_DEPTH: stack overflow → back off · near cap → ×2 · far below → ÷2"]],
 ["intents","pbt",690,780,170,300,"a","Find literals","pbt_intents.py",["Top-level key = number lines","dec · hex · oct · bin · float","True value in Python"],true,
   ["outside int64 or infinite → skip"]],
 ["oracle","pbt",880,780,190,172,"b","Check each value","oracle_runner.py",["x = ⟨literal⟩ alone → valprobe","int: exact match · float: same bits"],true,
   ["equals Python → PASS, else FAIL"]],
 ["shrink","pbt",1090,780,210,220,"c","Shrink the failure","pbt_minimizer.py",[],true,
   ["first FAIL → cut until it parses"]],
 ["axes","pbt",880,966,200,136,"d","Axis coverage","pbt_tracker.py",["base · length · underscores","5 generic length bins"],true,
   ["bin seen < 25 times → gap"]],
 ["next","gen",1350,730,210,380,"11","Next prompt","strategy_generator.py",[],false,[]],
];
const GROUPS=[["pbtg","pbt",670,730,640,380,"8","Property-based oracle","pbt/ + valprobe · primary signal"]];

// ----- edges: [stepIds, points, type, label, lx, ly, noarrow]
const E=[
 [["inputs","prompt"],[[260,240],[300,240]],"main"],
 [["prompt","llm"],[[550,240],[590,240]],"main"],
 [["llm","checks"],[[810,240],[850,240]],"main"],
 [["checks","gate"],[[1100,240],[1140,240]],"main"],
 [["gate","prompt"],[[1300,110],[1300,82],[425,82],[425,110]],"retry","retry with diagnosis",860,82],
 [["gate","campaign"],[[1350,370],[1350,430]],"main","pass",1380,412],
 [["campaign","harness"],[[1140,540],[1100,540]],"main"],
 [["harness","triage"],[[720,540],[680,540]],"main"],
 [["triage","crash"],[[300,540],[260,540]],"main"],
 [["triage","evidence","pbtg"],[[490,650],[490,690]],"data",null,0,0,true],
 [["triage","evidence","pbtg"],[[200,690],[990,690]],"data","500 results",600,690,true],
 [["triage","evidence"],[[200,690],[200,730]],"data"],
 [["triage","pbtg"],[[990,690],[990,730]],"data"],
 [["evidence","decide"],[[360,900],[390,900]],"main"],
 [["pbtg"],[[860,840],[880,840]],"pbt"],
 [["pbtg"],[[1070,840],[1090,840]],"pbt"],
 [["pbtg"],[[860,1030],[880,1030]],"pbt"],
 [["pbtg","next"],[[1300,840],[1350,840]],"pbt"],
 [["pbtg","next"],[[1080,1030],[1320,1030],[1320,840]],"pbt",null,0,0,true],
 [["decide","next"],[[515,1110],[515,1130],[1420,1130],[1420,1110]],"fb","signals, weight, depth, best version",960,1130],
 [["next","prompt"],[[1560,900],[1585,900],[1585,1155],[20,1155],[20,395],[425,395],[425,370]],"fb","next version: V2 … V5 · stop after V5 or when budget is spent",760,1155],
];

// stages for step mode
const STEPS=[
 ["inputs"],["prompt"],["llm"],["checks"],["gate"],["campaign"],["harness"],["triage","crash"],
 ["pbtg","intents","oracle","shrink","axes"],["evidence"],["decide"],["next"]
];

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KC={setup:"k-setup",gen:"k-gen",gate:"k-gate",exec:"k-exec",pbt:"k-pbt",analysis:"k-analysis",decide:"k-decide"};
const els={};

for(const [id,k,x,y,w,h,num,t,f] of GROUPS){
  const d=document.createElement("div"); d.className="group "+KC[k]; d.dataset.id=id;
  Object.assign(d.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  d.innerHTML=`<div class="gh"><span class="node-num" style="font:600 14px var(--mono);color:var(--k)">${num}</span><span class="nt">${esc(t)}</span><span class="nf">${esc(f)}</span></div>`;
  stage.appendChild(d); els[id]=d;
}

const NS="http://www.w3.org/2000/svg";
const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","edges");
svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
const COL={main:"var(--edge)",retry:"var(--k-gate)",data:"var(--k-exec)",fb:"var(--k-decide)",pbt:"var(--k-pbt)"};
const defs=document.createElementNS(NS,"defs");
for(const [k,c] of Object.entries(COL)){
  const m=document.createElementNS(NS,"marker");
  m.setAttribute("id","a-"+k); m.setAttribute("viewBox","0 0 10 10"); m.setAttribute("refX","9"); m.setAttribute("refY","5");
  m.setAttribute("markerWidth","7"); m.setAttribute("markerHeight","7"); m.setAttribute("orient","auto-start-reverse");
  const p=document.createElementNS(NS,"path"); p.setAttribute("d","M0 0L10 5L0 10z"); p.setAttribute("fill",c); m.appendChild(p); defs.appendChild(m);
}
svg.appendChild(defs);
const edgeEls=[];
for(const [ids,pts,t,lab,lx,ly,noarrow] of E){
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d","M"+pts.map(q=>q.join(" ")).join(" L"));
  p.setAttribute("fill","none"); p.setAttribute("stroke",COL[t]);
  p.setAttribute("stroke-width",t==="main"?"1.8":"2.2");
  if(t==="retry") p.setAttribute("stroke-dasharray","7 5");
  if(!noarrow) p.setAttribute("marker-end",`url(#a-${t})`);
  p.style.transition="opacity .25s";
  svg.appendChild(p); edgeEls.push([ids,p]);
}
stage.appendChild(svg);

for(const [id,k,x,y,w,h,num,t,f,bul,small,dec] of N){
  const d=document.createElement("div"); d.className="node "+KC[k]+(small?" small":""); d.dataset.id=id;
  Object.assign(d.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
  let inner=`<div class="nh">${num?`<span class="num">${num}</span>`:""}<span class="nt">${esc(t)}</span></div><div class="nf">${esc(f)}</div>`;
  if(id==="next"){
    inner+=`<ul><li>Seed + best generator + rules</li><li>Blocks in priority order:</li></ul><div class="tagrow" style="margin-top:6px">`+
      ["Capability","PBT target","PBT feedback","Campaign signals","Malformed","Structural","Weight","Depth"].map(s=>`<span class="tg ${s.startsWith("PBT")?"k-pbt":"k-gen"}">${s}</span>`).join("")+`</div><ul style="margin-top:8px"><li>Loops back to step 1</li></ul>`;
  } else if(id==="shrink"){
    inner+=`<ul><li>Shortest failing literal: <span class="hl">50 chars</span></li><li>Cause: fixed 50-byte buffer</li><li>Reported as issue #54, fixed upstream</li></ul>`;
  } else if(bul.length){
    inner+=`<ul>${bul.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  }
  if(dec&&dec.length){
    inner+=`<ul class="dec">${dec.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  }
  d.innerHTML=inner; stage.appendChild(d); els[id]=d;
}

const labels=[];
for(const [ids,pts,t,lab,lx,ly] of E){
  if(!lab) continue;
  const s=document.createElement("span"); s.className="elabel"; s.style.left=lx+"px"; s.style.top=ly+"px"; s.textContent=lab;
  stage.appendChild(s); labels.push([ids,s]);
}

// ----- fit to screen
const fitbox=document.getElementById("fitbox"), sizer=document.getElementById("sizer");
let user=1, z=1;
const zval=document.getElementById("zval");
function baseZ(){ return Math.max(.42,Math.min(fitbox.clientWidth/W,fitbox.clientHeight/H)); }
function fit(keepCenter){
  // remember the point at the centre of the view so zooming keeps it in place
  const cx=(fitbox.scrollLeft+fitbox.clientWidth/2)/z, cy=(fitbox.scrollTop+fitbox.clientHeight/2)/z;
  z=baseZ()*user;
  stage.style.transform=`scale(${z})`; sizer.style.width=W*z+"px"; sizer.style.height=H*z+"px";
  zval.textContent=Math.round(user*100)+"%";
  fitbox.classList.toggle("pan",user>1);
  if(keepCenter){ fitbox.scrollLeft=cx*z-fitbox.clientWidth/2; fitbox.scrollTop=cy*z-fitbox.clientHeight/2; }
}
function setUser(u){ user=Math.max(1,Math.min(3,Math.round(u*100)/100)); fit(true); if(user>1&&cur>=0) focusStage(cur); }
document.getElementById("zin").onclick=()=>setUser(user+.25);
document.getElementById("zout").onclick=()=>setUser(user-.25);
document.getElementById("zfit").onclick=()=>{user=1;fit(false);fitbox.scrollTo(0,0);};
fitbox.addEventListener("wheel",e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); setUser(user*(e.deltaY<0?1.12:1/1.12)); } },{passive:false});
// drag to pan when zoomed in
let drag=null;
fitbox.addEventListener("pointerdown",e=>{ if(user<=1||e.button!==0) return; drag={x:e.clientX,y:e.clientY,l:fitbox.scrollLeft,t:fitbox.scrollTop,moved:false}; fitbox.classList.add("drag"); });
addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; fitbox.scrollLeft=drag.l-dx; fitbox.scrollTop=drag.t-dy; });
addEventListener("pointerup",()=>{ drag=null; fitbox.classList.remove("drag"); });
function focusStage(i){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of STEPS[i]){ const r=els[id]; if(!r) continue;
    const L=parseFloat(r.style.left),T=parseFloat(r.style.top);
    x0=Math.min(x0,L);y0=Math.min(y0,T);x1=Math.max(x1,L+parseFloat(r.style.width));y1=Math.max(y1,T+parseFloat(r.style.height)); }
  fitbox.scrollTo({left:((x0+x1)/2)*z-fitbox.clientWidth/2, top:((y0+y1)/2)*z-fitbox.clientHeight/2, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
addEventListener("resize",()=>fit(true)); fit(false);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fit(true));

// ----- step mode
let cur=-1;
const stepno=document.getElementById("stepno");
function show(i){
  cur=i;
  if(i<0){
    Object.values(els).forEach(e=>e.classList.remove("dim","on"));
    edgeEls.forEach(([,p])=>p.style.opacity=""); labels.forEach(([,s])=>s.style.opacity="");
    stepno.textContent="overview"; return;
  }
  const act=new Set(STEPS[i]);
  for(const [id,e] of Object.entries(els)){
    const on=act.has(id)||(act.has("pbtg")&&["intents","oracle","shrink","axes"].includes(id));
    e.classList.toggle("dim",!on); e.classList.toggle("on",on&&e.classList.contains("node")&&!["intents","oracle","shrink","axes"].includes(id));
  }
  const rel=ids=>ids.some(x=>act.has(x));
  edgeEls.forEach(([ids,p])=>p.style.opacity=rel(ids)?"1":".12");
  labels.forEach(([ids,s])=>s.style.opacity=rel(ids)?"1":".12");
  stepno.textContent=`stage ${i+1} / ${STEPS.length}`;
  if(user>1) focusStage(i);
}
document.getElementById("next").onclick=()=>show(Math.min(STEPS.length-1,cur+1));
document.getElementById("prev").onclick=()=>show(Math.max(-1,cur-1));
document.getElementById("all").onclick=()=>show(-1);
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();show(Math.min(STEPS.length-1,cur+1));}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(Math.max(-1,cur-1));}
  else if(e.key==="Escape"){show(-1);}
  else if(e.key==="+"||e.key==="="){e.preventDefault();setUser(user+.25);}
  else if(e.key==="-"||e.key==="_"){e.preventDefault();setUser(user-.25);}
  else if(e.key==="0"){user=1;fit(false);fitbox.scrollTo(0,0);}
});
document.getElementById("fs").onclick=()=>{
  try{
    const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    if(p&&p.catch) p.catch(()=>{});
  }catch(_){}
};
document.addEventListener("fullscreenchange",()=>setTimeout(()=>fit(true),60));
})();
</script>
