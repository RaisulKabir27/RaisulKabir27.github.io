<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Data Fabric FL Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one 1600x900 illustrated scene; a camera (SVG viewBox) flies to each stage; caption bar under it. */
:root{
  --bg:#eaeef2; --surface:#ffffff; --ink:#13202b; --muted:#566472; --line:#c8d1da; --dot:#cfd7df; --edge:#7d8996;
  --code:#18212c; --code-ink:#cfe0f5;
  --hosp:#0b7a6e; --crypt:#5040cc; --prep:#2a66a6; --train:#0b6f95; --agg:#b25d06; --fab:#2a7a45; --gov:#8b3a8a; --lake:#1672a2;
  --barA:#7e8b99; --barB:#b9c3cd; --best:#b25d06; --best2:#e0a868;
  --display:"Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1116; --surface:#151c23; --ink:#e3eaf0; --muted:#98a6b3; --line:#2a3540; --dot:#1c252e; --edge:#7f8c99;
  --code:#0a0e13; --code-ink:#cfe0f5;
  --hosp:#3fcbb8; --crypt:#a59cff; --prep:#6eaef0; --train:#4cc0e6; --agg:#f0a54a; --fab:#62d08b; --gov:#d98ad6; --lake:#5bb5e8;
  --barA:#6f7d8b; --barB:#3d4955; --best:#f0a54a; --best2:#8a6230; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1116; --surface:#151c23; --ink:#e3eaf0; --muted:#98a6b3; --line:#2a3540; --dot:#1c252e; --edge:#7f8c99;
  --code:#0a0e13; --code-ink:#cfe0f5;
  --hosp:#3fcbb8; --crypt:#a59cff; --prep:#6eaef0; --train:#4cc0e6; --agg:#f0a54a; --fab:#62d08b; --gov:#d98ad6; --lake:#5bb5e8;
  --barA:#6f7d8b; --barB:#3d4955; --best:#f0a54a; --best2:#8a6230; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;gap:8px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px}
h1{margin:0;font-family:var(--display);font-size:clamp(17px,1.9vw,26px);line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--edge)}
.btn:focus-visible{outline:2px solid var(--crypt);outline-offset:2px}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--hosp) 14%,var(--surface));border-color:color-mix(in srgb,var(--hosp) 55%,var(--line))}
.stepno{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:64px;text-align:center}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-right:8px}
.lg svg{width:30px;height:8px}
.frame{flex:1;min-height:0;position:relative;border-radius:12px;overflow:hidden;background:var(--bg)}
#scene{width:100%;height:100%;display:block;cursor:default}
.cap{display:flex;align-items:center;gap:14px;min-height:54px;padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cap-n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--display);color:var(--surface);background:var(--ink)}
.cap-txt{min-width:0}
.cap-t{font:600 17px/1.2 var(--display)}
.cap-d{font-size:14px;color:var(--muted);margin-top:2px}
.cap-d b{color:var(--ink);font-weight:600}
.cap-d span+span::before{content:"·";margin:0 8px;color:var(--line)}

/* ---- SVG scene ---- */
.dotc{fill:var(--dot)}
.weave-h{stroke:color-mix(in srgb,var(--fab) 9%,transparent);stroke-width:3}
.weave-v{stroke:color-mix(in srgb,var(--fab) 6%,transparent);stroke-width:3}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.card.main{stroke:color-mix(in srgb,var(--hosp) 60%,var(--line))}
.card.back{fill:color-mix(in srgb,var(--hosp) 5%,var(--surface))}
.fabcard{fill:var(--surface);stroke:color-mix(in srgb,var(--fab) 60%,var(--line));stroke-width:1.5}
.tile{fill:color-mix(in srgb,var(--c) 6%,var(--surface));stroke:color-mix(in srgb,var(--c) 45%,var(--line));stroke-width:1.5;transition:stroke-width .3s}
.zone{fill:color-mix(in srgb,var(--c) 6%,var(--surface));stroke:color-mix(in srgb,var(--c) 35%,var(--line));stroke-width:1.2;transition:stroke-width .3s}
.tile.on,.zone.on{stroke:var(--c);stroke-width:3}
.badge{fill:var(--c)}
.badge-t{fill:var(--surface);font:700 12.5px var(--display)}
.t-title{font-family:var(--display);font-weight:600;font-size:16px;fill:var(--ink)}
.t-big{font-family:var(--display);font-weight:700;font-size:21px;fill:var(--ink)}
.t-sub{font-family:var(--mono);font-size:11px;fill:var(--c,var(--muted))}
.t-lbl{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.t-s{font-family:var(--sans);font-size:12px;fill:var(--ink);font-weight:600}
.t-mono{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.t-zone{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.09em;fill:var(--c)}
.code{fill:var(--code)}
.code-t{font-family:var(--mono);font-size:10.5px;fill:var(--code-ink)}
.imgframe{fill:#000;stroke:var(--surface);stroke-width:3}
.imgline{fill:none;stroke:var(--line);stroke-width:1}
.pix{image-rendering:pixelated}
.ln{fill:none;stroke:var(--edge);stroke-width:2}
.ln.hosp{stroke:var(--hosp)} .ln.agg{stroke:var(--agg)} .ln.fab{stroke:var(--fab)}
.ln.net{stroke-dasharray:7 6;animation:dash 1.1s linear infinite;stroke-width:2.4}
@keyframes dash{to{stroke-dashoffset:-13}}
.mk-edge{fill:var(--edge)} .mk-hosp{fill:var(--hosp)} .mk-agg{fill:var(--agg)} .mk-fab{fill:var(--fab)}
.ih-body{fill:color-mix(in srgb,var(--hosp) 16%,var(--surface));stroke:var(--hosp);stroke-width:1.6}
.ih-tower{fill:var(--hosp)} .ih-cross{stroke:var(--surface);stroke-width:3;stroke-linecap:round} .ih-win{fill:var(--hosp)}
.lk-sh{fill:none;stroke:var(--crypt);stroke-width:3} .lk-body{fill:var(--crypt)} .lk-hole{fill:var(--surface)}
.fl-body{fill:var(--surface);stroke:var(--fc,var(--hosp));stroke-width:1.4}
.fl-fold{fill:none;stroke:var(--fc,var(--hosp));stroke-width:1.4}
.fl-t{font-family:var(--mono);font-weight:600;fill:var(--fc,var(--hosp))}
.db-side{fill:color-mix(in srgb,var(--hosp) 14%,var(--surface));stroke:var(--hosp);stroke-width:1.6}
.db-top{fill:color-mix(in srgb,var(--hosp) 30%,var(--surface));stroke:var(--hosp);stroke-width:1.6}
.db-line{fill:none;stroke:var(--hosp);stroke-width:1.2}
.rk-u{fill:color-mix(in srgb,var(--agg) 14%,var(--surface));stroke:var(--agg);stroke-width:1.5}
.rk-led{fill:var(--agg)} .rk-ln{stroke:var(--agg);stroke-width:1.5}
.crown{fill:var(--agg)}
.bar-c{fill:color-mix(in srgb,var(--agg) 22%,var(--surface));stroke:color-mix(in srgb,var(--agg) 45%,var(--line));stroke-width:1.2}
.bar-c.win{fill:var(--agg);stroke:var(--agg)}
.chip{fill:var(--surface);stroke:var(--line);stroke-dasharray:4 3}
.fd-back{fill:color-mix(in srgb,var(--fab) 35%,var(--surface));stroke:var(--fab);stroke-width:1.3}
.fd-front{fill:color-mix(in srgb,var(--fab) 16%,var(--surface));stroke:var(--fab);stroke-width:1.3}
.fd-t{font-family:var(--mono);font-size:9.5px;font-weight:600;fill:var(--fab)}
.sh-body{fill:color-mix(in srgb,var(--gov) 14%,var(--surface));stroke:var(--gov);stroke-width:1.8}
.sh-tick{fill:none;stroke:var(--gov);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bn-lid,.bn-ln{fill:none;stroke:var(--gov);stroke-width:2;stroke-linecap:round}
.bn-body{fill:color-mix(in srgb,var(--gov) 10%,var(--surface));stroke:var(--gov);stroke-width:1.8}
.lake{fill:color-mix(in srgb,var(--lake) 16%,var(--surface));stroke:color-mix(in srgb,var(--lake) 55%,var(--line));stroke-width:1.4}
.wave{fill:none;stroke:color-mix(in srgb,var(--lake) 50%,transparent);stroke-width:1.6}
.gear{fill:color-mix(in srgb,var(--lake) 18%,var(--surface));stroke:var(--lake);stroke-width:1.6}
.gear-h{fill:var(--surface);stroke:var(--lake);stroke-width:1.6}
.nt-ln{stroke:color-mix(in srgb,var(--fab) 55%,var(--line));stroke-width:1.2}
.nt-n{fill:var(--fab);stroke:var(--surface);stroke-width:1.5}
.wv-a{fill:color-mix(in srgb,var(--fab) 70%,var(--surface))} .wv-b{fill:color-mix(in srgb,var(--fab) 35%,var(--surface));stroke:var(--surface);stroke-width:1}
.slab-f{fill:color-mix(in srgb,var(--c) 75%,var(--surface))}
.slab-s{fill:color-mix(in srgb,var(--c) 30%,var(--surface));stroke:color-mix(in srgb,var(--c) 60%,var(--surface));stroke-width:.6}
.skip{fill:none;stroke:var(--agg);stroke-width:1.4}
.dense{fill:var(--surface);stroke:var(--c);stroke-width:1.4}
.cellbg{fill:color-mix(in srgb,var(--best) 12%,var(--surface));stroke:color-mix(in srgb,var(--best) 50%,var(--line));stroke-width:1.2}
.grid{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--edge);stroke-width:1.4}
.barA{fill:var(--barA)} .barB{fill:var(--barB)}
.barBest{fill:var(--best)} .barBest2{fill:var(--best2)}
.barPlain{fill:var(--barA)} .barEnc{fill:var(--crypt)}
.v{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.v.best{fill:var(--best);font-weight:600}
.bignum{font-family:var(--display);font-weight:700;font-size:54px;fill:var(--best)}
.pill{fill:var(--surface);stroke:color-mix(in srgb,var(--hosp) 55%,var(--line));stroke-width:1.3}
.pkt rect{fill:var(--surface);stroke:var(--agg);stroke-width:1.4}
.pkt text{font-family:var(--mono);font-size:7.5px;font-weight:600;fill:var(--agg)}
.pkt.hosp circle{fill:var(--hosp);stroke:var(--surface);stroke-width:2}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
[data-k],[data-rel],[data-frame]{transition:opacity .35s}
.dim{opacity:.13}
.half{opacity:.5}
[data-k]{cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.lg{display:none}.cap-d{font-size:12.5px}.cap-t{font-size:15px}}
</style>

function fitBox(b,pad){const r=Math.max(.3,frame.clientWidth/Math.max(1,frame.clientHeight));let [x,y,w,h]=b;
  x-=w*pad;y-=h*pad;w*=1+2*pad;h*=1+2*pad;
  if(w/h<r){const W=h*r;x-=(W-w)/2;w=W;}else{const H=w/r;y-=(H-h)/2;h=H;}return [x,y,w,h];}
function setVB(b){vb=b;svg.setAttribute("viewBox",b.map(v=>v.toFixed(2)).join(" "));}
function camTo(b,pad,instant){const tgt=fitBox(b,pad);cancelAnimationFrame(anim);
  if(instant||REDUCE){setVB(tgt);return;}
  const from=vb.slice(),t0=performance.now(),D=750;
  const tick=now=>{let t=Math.min(1,(now-t0)/D);t=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;setVB(from.map((v,i)=>v+(tgt[i]-v)*t));if(t<1)anim=requestAnimationFrame(tick);};
  anim=requestAnimationFrame(tick);}
function target(){return (cur>=0&&zoomOn)?[STEPS[cur].box,.05]:[OVERVIEW,.01];}

/* ---------- spotlight ---------- */
const stepno=document.getElementById("stepno"),capn=document.getElementById("capn"),capt=document.getElementById("capt"),capd=document.getElementById("capd");
const kEls=[...svg.querySelectorAll("[data-k]")],rEls=[...svg.querySelectorAll("[data-rel]")],fEls=[...svg.querySelectorAll("[data-frame]")];
function show(i,instant){
  cur=i;
  if(i<0){[...kEls,...rEls,...fEls].forEach(e=>e.classList.remove("dim","half"));svg.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));
    stepno.textContent="overview";capn.textContent="◎";capt.textContent="Overview";
    capd.innerHTML="<span>12 stages</span><span>press → or ▶ to walk through</span><span>click any part to jump there</span>";}
  else{const act=new Set(STEPS[i].ids);
    kEls.forEach(e=>{const on=act.has(e.dataset.k);e.classList.toggle("dim",!on);const r=e.querySelector(":scope > .tile, :scope > .zone");if(r)r.classList.toggle("on",on);});
    rEls.forEach(e=>e.classList.toggle("dim",!e.dataset.rel.split(" ").some(x=>act.has(x))));
    fEls.forEach(e=>{const any=e.dataset.frame.split(" ").some(x=>act.has(x));e.classList.toggle("dim",!any);});
    stepno.textContent=`stage ${i+1} / ${STEPS.length}`;capn.textContent=String(i+1);capt.textContent=STEPS[i].t;
    capd.innerHTML=STEPS[i].d.map(s=>`<span>${s}</span>`).join("");}
  const [b,p]=target();camTo(b,p,instant);}
document.getElementById("next").onclick=()=>show(Math.min(STEPS.length-1,cur+1));
document.getElementById("prev").onclick=()=>show(Math.max(-1,cur-1));
document.getElementById("all").onclick=()=>show(-1);
const zb=document.getElementById("zoom");
zb.onclick=()=>{zoomOn=!zoomOn;zb.setAttribute("aria-pressed",String(zoomOn));const [b,p]=target();camTo(b,p);};
svg.addEventListener("click",e=>{const g=e.target.closest("[data-k]");if(!g)return;const k=g.dataset.k;const i=STEPS.findIndex(s=>s.ids[0]===k);const j=i>=0?i:STEPS.findIndex(s=>s.ids.includes(k));if(j>=0&&j!==cur)show(j);});
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("button")&&(e.key===" "||e.key==="Enter"))return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(Math.min(STEPS.length-1,cur+1));}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(Math.max(-1,cur-1));}
  else if(e.key==="Escape"||e.key==="Home"){show(-1);}
  else if(e.key==="z"||e.key==="Z"){zb.click();}
  else if(e.key==="f"||e.key==="F"){document.getElementById("fs").click();}});
document.getElementById("fs").onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(_){}};
let rt=0;const refit=()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>{const [b,p]=target();camTo(b,p,true);});};
addEventListener("resize",refit);document.addEventListener("fullscreenchange",()=>setTimeout(refit,80));
if("ResizeObserver" in window)new ResizeObserver(refit).observe(frame);
show(-1,true);
})();
</script>

</body></html>
